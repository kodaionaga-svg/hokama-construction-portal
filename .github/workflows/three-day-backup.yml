name: 施工管理データの定期バックアップ

on:
  schedule:
    # UTC 18:00 = 日本時間 03:00。処理側で前回成功から72時間を判定します。
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-backup:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: データバックアップを作成
        env:
          # Project URL is public configuration; the sensitive service key stays in Secrets.
          SUPABASE_URL: https://schttjeinzdhjemgtdvi.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_OUTPUT_DIR: backup-output
          FORCE_BACKUP: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python backup_manager/automated_backup.py

